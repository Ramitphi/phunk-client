name: pages

# Builds the microsite from docs/ and site/ on every push and pull request.
# Deploys to GitHub Pages only from main.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    paths: ["docs/**", "site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build (fails on broken links)
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
