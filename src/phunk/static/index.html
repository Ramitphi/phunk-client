<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>phunk</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">phunk</div>
  <div id="who" class="who"></div>
  <button id="theme" class="ghost small" type="button">Theme: auto</button>
</header>

<div id="banner" class="banner" hidden></div>

<main class="layout">
  <form id="lookup" class="lookup row">
    <label for="lookup-name" class="muted small">See anyone's people</label>
    <input id="lookup-name" placeholder="username or fid, e.g. dwr" autocomplete="off" autocapitalize="off">
    <button type="submit" class="small">Look up</button>
    <button type="button" id="lookup-me" class="ghost small" hidden>Back to me</button>
  </form>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="people" aria-selected="true">People</button>
    <button type="button" role="tab" data-tab="casts" aria-selected="false">Casts</button>
  </nav>

  <section id="people-pane" class="pane" data-pane="people">
    <div id="summary" class="summary"></div>
    <div id="people" class="people" aria-live="polite"></div>
    <div class="row between muted small foot">
      <span id="people-status"></span>
      <button id="people-refresh" type="button" class="ghost small">Refresh</button>
    </div>
  </section>

  <section id="casts-pane" class="pane" data-pane="casts">
    <div class="row between">
      <button id="new-cast" type="button">New cast</button>
      <span id="feed-status" class="muted small"></span>
    </div>

    <form id="compose" class="card compose" hidden>
      <textarea id="compose-text" rows="3" maxlength="1024" placeholder="What's happening?" aria-label="New cast"></textarea>
      <div class="row">
        <input id="compose-channel" placeholder="channel (optional): name or URL" autocomplete="off" autocapitalize="off">
        <span id="compose-count" class="muted small">0/1024</span>
        <button type="submit">Cast</button>
      </div>
    </form>

    <div class="card controls">
      <div class="row">
        <label for="hours">Window</label>
        <select id="hours">
          <option value="6">6 hours</option>
          <option value="24" selected>24 hours</option>
          <option value="72">3 days</option>
          <option value="168">7 days</option>
        </select>
        <button id="refresh" type="button" class="ghost">Refresh</button>
      </div>
      <details id="apps-box">
        <summary>Apps <span id="apps-summary" class="muted small"></span></summary>
        <p class="muted small">Show casts signed by these apps. Unticked apps are hidden.</p>
        <div class="row small">
          <button type="button" class="ghost small" id="apps-all">All</button>
          <button type="button" class="ghost small" id="apps-none">None</button>
        </div>
        <div id="apps" class="apps"></div>
      </details>
    </div>

    <div id="feed" class="feed" aria-live="polite"></div>
    <button id="more" type="button" class="wide" hidden>Load more</button>
  </section>
</main>

<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
